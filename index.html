<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Clone</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #14213d;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; border-radius: 6px; }
</style>
</head>
<body>
<canvas id="c" aria-label="Flappy clone game. Press space, click or tap to flap."></canvas>

<script>
(function () {
  "use strict";

  // ---------- Setup ----------
  var W = 360, H = 640, GROUND = 96;
  var BIRD_X = 96, BIRD_R = 13;
  var PIPE_W = 58, PIPE_SPACING = 190;
  var GRAVITY = 0.42, FLAP = -7.4, MAX_FALL = 9.5;

  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var scale = 1;

  function resize() {
    scale = Math.min(window.innerWidth / W, window.innerHeight / H);
    cv.style.width = Math.floor(W * scale) + "px";
    cv.style.height = Math.floor(H * scale) + "px";
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------- Sound (generated in the browser, no audio files) ----------
  var audio = null, muted = false;
  function ensureAudio() {
    if (audio) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audio = new AC();
    } catch (e) { audio = null; }
    if (audio && audio.state === "suspended") audio.resume();
  }
  function beep(freq, dur, type, vol, slideTo, delay) {
    if (!audio || muted) return;
    try {
      var t0 = audio.currentTime + (delay || 0);
      var o = audio.createOscillator();
      var g = audio.createGain();
      o.type = type || "sine";
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol || 0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g);
      g.connect(audio.destination);
      o.start(t0);
      o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  var sfx = {
    flap:  function () { beep(380, 0.12, "square", 0.08, 640); },
    score: function () { beep(880, 0.08, "triangle", 0.14); beep(1320, 0.12, "triangle", 0.14, null, 0.07); },
    hit:   function () { beep(180, 0.22, "sawtooth", 0.18, 60); },
    fall:  function () { beep(420, 0.45, "triangle", 0.12, 90, 0.12); }
  };

  // ---------- Saved best score ----------
  var best = 0;
  try { best = parseInt(localStorage.getItem("flappy_clone_best"), 10) || 0; } catch (e) { best = 0; }
  function saveBest() {
    try { localStorage.setItem("flappy_clone_best", String(best)); } catch (e) {}
  }

  // ---------- Game state ----------
  var state = "ready"; // ready | play | over
  var bird, pipes, score, speed, groundX, flash, shake, overAt, newBest, clock;

  var clouds = [];
  for (var i = 0; i < 6; i++) {
    clouds.push({ x: Math.random() * W, y: 40 + Math.random() * 220, s: 0.6 + Math.random() * 0.9 });
  }

  function reset() {
    bird = { x: BIRD_X, y: H / 2 - 40, vy: 0, rot: 0 };
    pipes = [];
    score = 0;
    speed = 2.2;
    groundX = 0;
    flash = 0;
    shake = 0;
    newBest = false;
    state = "ready";
  }

  function addPipe(x) {
    var gap = Math.max(112, 152 - score * 1.5);
    var minTop = 70;
    var maxTop = H - GROUND - 70 - gap;
    var top = minTop + Math.random() * (maxTop - minTop);
    pipes.push({ x: x, top: top, gap: gap, passed: false });
  }

  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  // ---------- Input ----------
  function flap() {
    ensureAudio();
    if (state === "ready") {
      state = "play";
      bird.vy = FLAP;
      sfx.flap();
    } else if (state === "play") {
      bird.vy = FLAP;
      sfx.flap();
    } else if (state === "over") {
      if (performance.now() - overAt > 600) reset();
    }
  }

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") {
      e.preventDefault();
      if (!e.repeat) flap();
    } else if (e.code === "KeyM") {
      muted = !muted;
    }
  });
  window.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    flap();
  }, { passive: false });

  // ---------- Collision ----------
  function circleHitsRect(cx, cy, r, rx, ry, rw, rh) {
    var nx = clamp(cx, rx, rx + rw);
    var ny = clamp(cy, ry, ry + rh);
    var dx = cx - nx, dy = cy - ny;
    return dx * dx + dy * dy < r * r;
  }

  function die() {
    if (state === "over") return;
    state = "over";
    overAt = performance.now();
    flash = 1;
    shake = 8;
    if (score > best) {
      best = score;
      newBest = true;
      saveBest();
    }
    sfx.hit();
    sfx.fall();
  }

  // ---------- Update ----------
  function update(k) {
    clock += k;
    var i;

    for (i = 0; i < clouds.length; i++) {
      clouds[i].x -= 0.15 * clouds[i].s * k;
      if (clouds[i].x < -80) {
        clouds[i].x = W + 60;
        clouds[i].y = 40 + Math.random() * 220;
      }
    }

    if (flash > 0) flash = Math.max(0, flash - 0.06 * k);
    if (shake > 0) shake = Math.max(0, shake - 0.5 * k);

    if (state === "ready") {
      bird.y = H / 2 - 40 + Math.sin(clock * 0.09) * 8;
      bird.rot = 0;
      groundX = (groundX + 1.5 * k) % 24;
      return;
    }

    if (state === "play") {
      speed = Math.min(3.4, 2.2 + score * 0.04);

      bird.vy = Math.min(bird.vy + GRAVITY * k, MAX_FALL);
      bird.y += bird.vy * k;
      bird.rot = clamp(bird.vy * 0.07, -0.45, 1.3);
      if (bird.y < BIRD_R) {
        bird.y = BIRD_R;
        if (bird.vy < 0) bird.vy = 0;
      }

      groundX = (groundX + speed * k) % 24;

      if (pipes.length === 0 || pipes[pipes.length - 1].x < W - PIPE_SPACING) {
        addPipe(pipes.length === 0 ? W + 60 : W + 30);
      }

      for (i = 0; i < pipes.length; i++) {
        var p = pipes[i];
        p.x -= speed * k;

        if (!p.passed && p.x + PIPE_W < bird.x - BIRD_R) {
          p.passed = true;
          score++;
          sfx.score();
        }

        var hitR = BIRD_R - 2;
        if (circleHitsRect(bird.x, bird.y, hitR, p.x, 0, PIPE_W, p.top) ||
            circleHitsRect(bird.x, bird.y, hitR, p.x, p.top + p.gap, PIPE_W, H)) {
          die();
        }
      }
      while (pipes.length && pipes[0].x < -PIPE_W - 10) pipes.shift();

      if (bird.y + BIRD_R >= H - GROUND) {
        bird.y = H - GROUND - BIRD_R;
        die();
      }
      return;
    }

    if (state === "over") {
      if (bird.y + BIRD_R < H - GROUND) {
        bird.vy = Math.min(bird.vy + GRAVITY * k, MAX_FALL + 3);
        bird.y += bird.vy * k;
        bird.rot = Math.min(bird.rot + 0.12 * k, 1.5);
        if (bird.y + BIRD_R > H - GROUND) bird.y = H - GROUND - BIRD_R;
      }
    }
  }

  // ---------- Drawing ----------
  function text(str, x, y, size, fill, align) {
    ctx.font = "bold " + size + "px 'Trebuchet MS', Verdana, sans-serif";
    ctx.textAlign = align || "center";
    ctx.textBaseline = "middle";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(3, size / 6);
    ctx.strokeStyle = "#1b2a41";
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill || "#fff";
    ctx.fillText(str, x, y);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawSky() {
    var g = ctx.createLinearGradient(0, 0, 0, H - GROUND);
    g.addColorStop(0, "#4fc3f7");
    g.addColorStop(1, "#d6f1ff");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // clouds
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 18 * c.s, 0, 6.2832);
      ctx.arc(c.x + 20 * c.s, c.y - 8 * c.s, 22 * c.s, 0, 6.2832);
      ctx.arc(c.x + 44 * c.s, c.y, 17 * c.s, 0, 6.2832);
      ctx.fill();
    }

    // far hills
    var base = H - GROUND;
    ctx.fillStyle = "#a5d8a0";
    ctx.beginPath();
    ctx.moveTo(0, base);
    for (var x = 0; x <= W; x += 10) {
      ctx.lineTo(x, base - 40 - Math.sin((x + clock * 0.3) * 0.02) * 18 - Math.sin(x * 0.05) * 6);
    }
    ctx.lineTo(W, base);
    ctx.fill();
  }

  function drawPipe(p) {
    var capH = 24, capW = PIPE_W + 8, capX = p.x - 4;
    var bodyGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
    bodyGrad.addColorStop(0, "#2f9e55");
    bodyGrad.addColorStop(0.35, "#6fd68a");
    bodyGrad.addColorStop(1, "#23823f");

    ctx.lineWidth = 2.5;
    ctx.strokeStyle = "#16542a";
    ctx.fillStyle = bodyGrad;

    // top pipe
    ctx.fillRect(p.x, 0, PIPE_W, p.top - capH);
    ctx.strokeRect(p.x, -3, PIPE_W, p.top - capH + 3);
    roundRect(capX, p.top - capH, capW, capH, 4);
    ctx.fill(); ctx.stroke();

    // bottom pipe
    var by = p.top + p.gap;
    ctx.fillRect(p.x, by + capH, PIPE_W, H - GROUND - by - capH);
    ctx.strokeRect(p.x, by + capH, PIPE_W, H - GROUND - by - capH + 3);
    roundRect(capX, by, capW, capH, 4);
    ctx.fill(); ctx.stroke();
  }

  function drawGround() {
    var y = H - GROUND;
    ctx.fillStyle = "#6cc24a";
    ctx.fillRect(0, y, W, 16);
    ctx.fillStyle = "#4f9d34";
    ctx.fillRect(0, y + 12, W, 4);
    ctx.fillStyle = "#e3c27a";
    ctx.fillRect(0, y + 16, W, GROUND - 16);

    ctx.fillStyle = "#d1ab5f";
    for (var x = -24 + (-groundX); x < W + 24; x += 24) {
      ctx.beginPath();
      ctx.moveTo(x, y + 16);
      ctx.lineTo(x + 12, y + 16);
      ctx.lineTo(x + 2, y + GROUND);
      ctx.lineTo(x - 10, y + GROUND);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = "#1b2a41";
    ctx.fillRect(0, y, W, 2);
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);

    // body
    ctx.fillStyle = "#ff7a59";
    ctx.strokeStyle = "#1b2a41";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(0, 0, 17, 14, 0, 0, 6.2832);
    ctx.fill(); ctx.stroke();

    // belly
    ctx.fillStyle = "#ffd9a0";
    ctx.beginPath();
    ctx.ellipse(2, 6, 10, 6, 0, 0, 6.2832);
    ctx.fill();

    // wing (flaps faster when rising)
    var flapSpeed = state === "play" ? 0.5 : 0.25;
    var wy = Math.sin(clock * flapSpeed) * 5;
    if (state === "over") wy = 4;
    ctx.fillStyle = "#e0553a";
    ctx.beginPath();
    ctx.ellipse(-5, 2 + wy * 0.4, 9, 5.5 + Math.abs(wy) * 0.3, -0.3, 0, 6.2832);
    ctx.fill(); ctx.stroke();

    // eye
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(8, -5, 5.5, 0, 6.2832);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#1b2a41";
    ctx.beginPath();
    ctx.arc(10, -5, 2.3, 0, 6.2832);
    ctx.fill();

    // beak
    ctx.fillStyle = "#ffc83d";
    ctx.beginPath();
    ctx.moveTo(14, 0);
    ctx.lineTo(25, 3);
    ctx.lineTo(14, 8);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    ctx.restore();
  }

  function drawPanel() {
    var w = 250, h = 170, x = (W - w) / 2, y = 190;
    ctx.fillStyle = "#fff7e0";
    ctx.strokeStyle = "#1b2a41";
    ctx.lineWidth = 3;
    roundRect(x, y, w, h, 14);
    ctx.fill(); ctx.stroke();

    text("Game over", W / 2, y + 32, 28, "#ff7a59");
    text("Score", x + 62, y + 76, 15, "#fff");
    text(String(score), x + 62, y + 104, 30, "#fff");
    text("Best", x + w - 62, y + 76, 15, "#fff");
    text(String(best), x + w - 62, y + 104, 30, newBest ? "#ffd23f" : "#fff");
    if (newBest) text("New best!", W / 2, y + 138, 16, "#ffd23f");

    if (performance.now() - overAt > 600) {
      var pulse = 0.6 + 0.4 * Math.sin(clock * 0.15);
      ctx.globalAlpha = pulse;
      text("Tap or press Space to retry", W / 2, y + h + 34, 17, "#fff");
      ctx.globalAlpha = 1;
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawSky();
    for (var i = 0; i < pipes.length; i++) drawPipe(pipes[i]);
    drawGround();
    drawBird();

    if (state === "play") {
      text(String(score), W / 2, 70, 52, "#fff");
    } else if (state === "ready") {
      text("Flappy Clone", W / 2, 150, 38, "#fff");
      var pulse = 0.65 + 0.35 * Math.sin(clock * 0.1);
      ctx.globalAlpha = pulse;
      text("Tap, click or press Space", W / 2, 400, 18, "#fff");
      ctx.globalAlpha = 1;
      if (best > 0) text("Best: " + best, W / 2, 440, 18, "#ffd23f");
    } else {
      text(String(score), W / 2, 70, 52, "#fff");
      drawPanel();
    }

    ctx.restore();

    if (flash > 0) {
      ctx.fillStyle = "rgba(255,255,255," + flash * 0.7 + ")";
      ctx.fillRect(0, 0, W, H);
    }
  }

  // ---------- Main loop ----------
  clock = 0;
  reset();
  var last = performance.now();
  function frame(now) {
    var dt = Math.min(now - last, 50);
    last = now;
    update(dt / 16.667);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
